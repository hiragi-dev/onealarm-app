<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent にすると iOS のホーム画面から開いたとき、描画は全画面なのに
         fixed の基準になる高さがステータスバーぶん短くなり、下部ナビや全画面ダイアログが
         下端に届かず画面の下に空白が残る。旧アプリ（eager-alarm-app）と同じく不透明にする。
         背景が黒なので black が馴染む。表示領域はステータスバーの下から始まり、
         env(safe-area-inset-top) は 0 になる（下のセーフエリアは viewport-fit=cover で残る） -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="OneAlarm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>OneAlarm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
